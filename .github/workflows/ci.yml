name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The native Bluetooth and SQLite modules only need to load on the platform the app targets.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prettier --check .

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
