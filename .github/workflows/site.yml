name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/*.png
      - build/icon.svg
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - run: |
          cp -r site _site
          cp docs/hero.png docs/screens.png build/icon.svg _site/

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
